name: SecurePipe DevSecOps Scan

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch: {}

jobs:
  security-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # --- Secret scanning -----------------------------------------------
      - name: Run Gitleaks (secret scanning)
  uses: gitleaks/gitleaks-action@cb7149a9b57195b609c63e8518d2c610d0fb15b2 # v2.3.4
  continue-on-error: true
  env:
    GITLEAKS_ENABLE_COMMENTS: "false"

      # --- Dependency / filesystem vulnerability scanning -----------------
      - name: Run Trivy (dependency scan)
        uses: aquasecurity/trivy-action@0.28.0
        continue-on-error: true
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'json'
          output: 'trivy-report.json'
          severity: 'CRITICAL,HIGH,MEDIUM,LOW'
          exit-code: '0'

      # --- Static application security testing (SAST) --------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Semgrep
        run: pip install semgrep

      - name: Run Semgrep (SAST)
        continue-on-error: true
        run: semgrep --config=auto --json --output=semgrep-report.json . || true

      # --- Score + dashboard generation -----------------------------------
      - name: Install scorecard dependencies
        run: pip install -r scripts/requirements.txt

      - name: Generate security scorecard
        run: python scripts/generate_scorecard.py

      - name: Upload scan artifacts
        uses: actions/upload-artifact@v4
        with:
          name: securepipe-reports
          path: |
            trivy-report.json
            semgrep-report.json
            gitleaks-report.json
            scorecard.json
            dashboard.html
          if-no-files-found: warn

      # Optional: fail the build if the score drops below a threshold.
      # Uncomment to turn this into a real merge gate.
      # - name: Enforce minimum security score
      #   run: python scripts/enforce_gate.py --min-score 60
