name: SecurePipe DevSecOps Scan

on:
  push:
    branches: [ main, master, develop, demo-vulnerable ]
  pull_request:
    branches: [ main, master, develop, demo-vulnerable ]
  workflow_dispatch: {}

jobs:
  security-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks (secret scanning)
        continue-on-error: true
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks detect --source . --report-format json --report-path gitleaks-report.json --exit-code 0

      - name: Run Trivy (dependency scan)
        uses: aquasecurity/trivy-action@master
        continue-on-error: true
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'json'
          output: 'trivy-report.json'
          severity: 'CRITICAL,HIGH,MEDIUM,LOW'
          exit-code: '0'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Semgrep
        run: pip install semgrep

      - name: Run Semgrep (SAST)
        continue-on-error: true
        run: semgrep --config=auto --json --output=semgrep-report.json . || true

      - name: Install scorecard dependencies
        run: pip install -r scripts/requirements.txt

      - name: Generate security scorecard
        run: python scripts/generate_scorecard.py

      - name: Upload scan artifacts
        uses: actions/upload-artifact@v4
        with:
          name: securepipe-reports
          path: |
            trivy-report.json
            semgrep-report.json
            gitleaks-report.json
            scorecard.json
            dashboard.html
          if-no-files-found: warn